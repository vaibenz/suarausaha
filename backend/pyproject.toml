[project]
name = "suarausaha"
version = "0.1.0"
description = "Voice first bookkeeping for Indonesian micro businesses, using Gemini function calling"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vaibhav Peddakadapa" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "google-genai>=1.30",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["suarausaha*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
